<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#241A38" />
      <stop offset="100%" stop-color="#140E20" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5B3DF5" />
      <stop offset="50%" stop-color="#8A72FF" />
      <stop offset="100%" stop-color="#FF5A3C" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Base Squircle with border -->
  <rect x="20" y="20" width="472" height="472" rx="110" ry="110" fill="url(#bgGrad)" stroke="#3A2C54" stroke-width="12" />
  
  <!-- Waveform Audio Bars -->
  <g fill="url(#waveGrad)" filter="url(#subtleGlow)">
    <!-- Bar 1: Left -->
    <rect x="110" y="191" width="38" height="130" rx="19" ry="19" />
    <!-- Bar 2: Mid-Left -->
    <rect x="182" y="121" width="38" height="270" rx="19" ry="19" />
    <!-- Bar 3: Mid-Right -->
    <rect x="254" y="86" width="38" height="340" rx="19" ry="19" />
    <!-- Bar 4: Right -->
    <rect x="326" y="161" width="38" height="190" rx="19" ry="19" />
  </g>
</svg>
